services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kopilka
      POSTGRES_USER: kopilka
      POSTGRES_PASSWORD: kopilka_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kopilka_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kopilka -d kopilka"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kopilka_postgres_data:
