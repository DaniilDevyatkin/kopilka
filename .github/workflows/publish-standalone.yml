name: Publish standalone production release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-standalone
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: postgresql://kopilka:build-only@127.0.0.1:5432/kopilka?schema=public
  SESSION_SECRET: build-only-session-secret-with-at-least-sixty-four-characters-2026-kopilka
  APP_ORIGIN: https://kopim.devyatkinprod.ru
  DEPLOYMENT_VERSION: ${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install and generate Prisma Client
        run: |
          npm ci --no-audit --no-fund
          # npm/cli#4828 can omit platform packages from a lockfile created on
          # Windows. Install the Linux Tailwind compiler only on the CI runner;
          # it is build-time-only and is not shipped to the VDS.
          oxide_tarball=$(npm pack \
            @tailwindcss/oxide-linux-x64-gnu@4.3.3 \
            --silent)
          mkdir -p node_modules/@tailwindcss/oxide-linux-x64-gnu
          tar -xzf "$oxide_tarball" \
            --strip-components=1 \
            -C node_modules/@tailwindcss/oxide-linux-x64-gnu
          rm -f "$oxide_tarball"
          npm run db:generate

      - name: Build compact Next.js standalone server
        shell: bash
        run: |
          set +e
          npx next build --webpack 2>&1 | tee next-build.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            {
              echo "### Next.js build failed"
              echo '```text'
              tail -n 80 next-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            message=$(tail -n 24 next-build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            printf '::error title=Next.js standalone build failed::%s\n' "$message"
            exit "$status"
          fi

      - name: Assemble application artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/kopilka-app"
          mkdir -p "$stage/.next" "$stage/bin"
          cp -a .next/standalone/. "$stage/"
          cp -a .next/static "$stage/.next/static"
          cp -a public "$stage/public"
          cp "$(command -v node)" "$stage/bin/node"
          chmod 0755 "$stage/bin/node"
          printf '%s\n' "$GITHUB_SHA" > "$stage/VERSION"
          tar -C "$stage" -czf kopilka-app-linux-x64.tar.gz .

      - name: Assemble temporary migration artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix deploy/migrator --omit=dev --no-audit --no-fund
          stage="$RUNNER_TEMP/kopilka-migrator"
          mkdir -p "$stage"
          cp -a deploy/migrator/node_modules "$stage/node_modules"
          cp -a deploy/migrator/package.json "$stage/package.json"
          cp -a prisma "$stage/prisma"
          cp prisma.config.ts "$stage/prisma.config.ts"
          tar -C "$stage" -czf kopilka-migrator-linux-x64.tar.gz .

      - name: Create checksums
        shell: bash
        run: |
          sha256sum \
            kopilka-app-linux-x64.tar.gz \
            kopilka-migrator-linux-x64.tar.gz > SHA256SUMS
          du -h kopilka-app-linux-x64.tar.gz kopilka-migrator-linux-x64.tar.gz

      - name: Publish stable production assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view production >/dev/null 2>&1; then
            gh release upload production \
              kopilka-app-linux-x64.tar.gz \
              kopilka-migrator-linux-x64.tar.gz \
              SHA256SUMS \
              --clobber
            gh release edit production \
              --title "Kopilka production artifacts" \
              --notes "Standalone production build from commit $GITHUB_SHA."
          else
            gh release create production \
              kopilka-app-linux-x64.tar.gz \
              kopilka-migrator-linux-x64.tar.gz \
              SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "Kopilka production artifacts" \
              --notes "Standalone production build from commit $GITHUB_SHA."
          fi
