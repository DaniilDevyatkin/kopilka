name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kopilka
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kopilka -d kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kopilka:kopilka_dev@127.0.0.1:5432/kopilka?schema=public
      TEST_DATABASE_URL: postgresql://kopilka:kopilka_dev@127.0.0.1:5432/kopilka_auth_test?schema=public
      SESSION_SECRET: ci-only-session-secret-with-more-than-sixty-four-random-looking-characters-2026
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test production route guards
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run start > "$RUNNER_TEMP/kopilka-production.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/kopilka-production.log"
              exit 1
            fi
            sleep 1
          done

          headers="$RUNNER_TEMP/private-route-headers"
          status=$(curl --silent --output /dev/null --dump-header "$headers" \
            --write-out '%{http_code}' http://127.0.0.1:3000/app/home)
          if [[ "$status" != "307" ]] || ! grep -Eiq '^location: (https?://[^/]+)?/login\r?$' "$headers"; then
            echo "Expected anonymous /app/home to redirect to /login; got HTTP $status"
            cat "$headers"
            cat "$RUNNER_TEMP/kopilka-production.log"
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
