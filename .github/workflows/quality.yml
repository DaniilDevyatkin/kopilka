name: Quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kopilka
          POSTGRES_USER: kopilka
          POSTGRES_PASSWORD: kopilka_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kopilka -d kopilka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kopilka:kopilka_dev@127.0.0.1:5432/kopilka?schema=public
      TEST_DATABASE_URL: postgresql://kopilka:kopilka_dev@127.0.0.1:5432/kopilka_auth_test?schema=public
      SESSION_SECRET: ci-only-session-secret-with-more-than-sixty-four-random-looking-characters-2026
      APP_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
